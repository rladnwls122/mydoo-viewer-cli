<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>마이두 뷰어</title>
    <link rel="stylesheet" href="lib/github-markdown.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside id="sidebar" aria-label="폴더 트리">
      <div class="sidebar-head">
        <button id="btn-open-folder" class="ghost" title="폴더 열기 (Ctrl+K)">📂 폴더</button>
        <button id="btn-open-file" class="ghost" title="파일 열기 (Ctrl+O)">📄 파일</button>
        <button id="btn-up" class="ghost" title="상위 폴더">⬆</button>
      </div>
      <div id="sidebar-path" class="path" title=""></div>
      <ul id="tree" class="tree"></ul>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="btn-toggle-sidebar" class="ghost" title="사이드바 토글 (Ctrl+B)">☰</button>
        <div id="current-file" class="current"></div>
      </header>
      <article id="viewer" class="markdown-body viewer empty">
        <div class="welcome">
          <h1>마이두 뷰어</h1>
          <p>좌측 <b>📂 폴더</b>로 폴더를 열거나 <b>📄 파일</b>로 직접 파일을 열어보세요.</p>
          <p class="muted">지원: <code>.md</code> · <code>.html</code> · <code>.txt</code> · <code>.docx</code> · <code>.hwp</code> · <code>.hwpx</code></p>
        </div>
      </article>
    </main>

    <script src="lib/marked.min.js"></script>
    <script src="lib/dompurify.min.js"></script>
    <script src="lib/mammoth.browser.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
