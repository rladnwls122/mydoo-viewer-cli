[package]
name = "mydoo-viewer"
version = "0.2.3"
description = "Light document viewer in the mydoo family — md, html, txt, docx, hwp, hwpx"
authors = ["mydoo"]
edition = "2021"
license = "MIT"

[lib]
name = "mydoo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
cfb = "0.10"
flate2 = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
