<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mydoo Viewer</title>
    <link rel="stylesheet" href="lib/github-markdown.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="no-sidebar">
    <aside id="sidebar" aria-label="탐색기">
      <div class="sidebar-head">
        <button id="btn-home" class="ghost" title="홈">🏠</button>
        <button id="btn-drives" class="ghost" title="드라이브 목록">💾</button>
        <button id="btn-up" class="ghost" title="상위 폴더">⬆</button>
        <button id="btn-theme" class="ghost theme-btn" title="다크/라이트 전환">🌙</button>
      </div>
      <div id="sidebar-path" class="path" title=""></div>
      <ul id="tree" class="tree"></ul>
      <div id="resize-handle" class="resize-handle" title="드래그해서 폭 조절"></div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="btn-toggle-sidebar" class="ghost" title="탐색기 (Ctrl+B)">📁 탐색기</button>
        <div id="current-file" class="current"></div>
      </header>
      <article id="viewer" class="markdown-body viewer empty">
        <div class="welcome">
          <h1>Mydoo Viewer</h1>
          <p>좌상단 <b>📁 탐색기</b>를 눌러 사이드바를 열거나, 탐색기에서 파일을 더블클릭하세요.</p>
          <p class="muted">지원: <code>.md</code> · <code>.html</code> · <code>.txt</code> · <code>.docx</code> · <code>.hwp</code> · <code>.hwpx</code></p>
        </div>
      </article>
    </main>

    <script src="lib/marked.min.js"></script>
    <script src="lib/dompurify.min.js"></script>
    <script src="lib/mammoth.browser.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
